# docker-compose.prod.yaml
# Override de prod : s'ajoute à docker-compose.yaml.
# Utilise l'image publiée sur ghcr.io, avec healthcheck et restart.

name: curriculum

services:
  cv:
    image: ghcr.io/vivien60/curriculum:latest
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
      start_interval: 2s
