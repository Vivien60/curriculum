# docker-compose.yaml
# Base commune à tous les environnements (réseau, volumes, labels Traefik).
# À combiner avec un override : dev ou prod.

name: curriculum

services:
  cv:
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${CV_PDF_PATH:? path du pdf manquant}
        target: /var/www/html/cv.pdf
        read_only: true
    networks:
      - web
    labels:
      env: ${ENV:-prod}
      traefik.http.routers.cv.rule: "Host(`${HOST:? HOST manquant }`)"

networks:
  web:
    name: web
    external: true
