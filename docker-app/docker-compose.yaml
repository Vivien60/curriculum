# docker-compose.yaml
# Base commune à tous les environnements (réseau, volumes, labels Traefik).
# À combiner avec un override : dev ou prod.

name: curriculum

x-container-storage-path: &container_storage_path "/srv/media"

services:
  cv:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Apache démarre en root puis bascule sur www-data pour ses workers
      - SETUID
      - SETGID
    volumes:
      - type: bind
        source: ${HOST_STORAGE_PATH}
        target: *container_storage_path
        read_only: true
        bind:
          # empêche Docker de créer un dossier si le fichier n'existe pas :
          # en effet, le comportement par défaut de Docker est de créer un dossier si le fichier n'existe pas
          create_host_path: false
    networks:
      - web
    labels:
      env: ${ENV:-prod}
      traefik.http.routers.cv.rule: "Host(`${HOST:? HOST manquant }`)"
      traefik.enable: "true"
    environment:
      MEDIA_PATH: *container_storage_path

networks:
  web:
    name: web
    external: true
