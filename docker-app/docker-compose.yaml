# docker-compose.yaml
# Base commune à tous les environnements (réseau, volumes, labels Traefik).
# À combiner avec un override : dev ou prod.

name: curriculum

x-cv-pdf-target: &cv_pdf_target /var/www/html/cv.pdf

services:
  cv:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Apache démarre en root puis bascule sur www-data pour ses workers
      - SETUID
      - SETGID
    volumes:
      - type: bind
        source: ${CV_PDF_PATH:? path du pdf manquant}
        target: *cv_pdf_target
        read_only: true
        bind:
          # empêche Docker de créer un dossier si le fichier n'existe pas :
          # en effet, le comportement par défaut de Docker est de créer un dossier si le fichier n'existe pas
          create_host_path: false
    networks:
      - web
    labels:
      env: ${ENV:-prod}
      traefik.http.routers.cv.rule: "Host(`${HOST:? HOST manquant }`)"
      traefik.enable: "true"
    environment:
      CV_PDF_PATH: *cv_pdf_target

networks:
  web:
    name: web
    external: true
