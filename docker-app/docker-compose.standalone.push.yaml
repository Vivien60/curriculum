# docker-compose.standalone.push.yaml
# Autonome : à utiliser seul, sans la base.
# Build l'image de prod et la tague pour ghcr.io (le push se fait avec `docker compose push`).

name: curriculum

services:
  cv:
    image: ghcr.io/vivien60/curriculum:${IMAGE_TAG:-latest}
    build:
      context : ../app
      dockerfile: ../docker-app/Dockerfile
      target: prod
      labels:
        ## sur GitHub Packages, ghcr.io, rattache l'image au repo :
        org.opencontainers.image.source: https://github.com/Vivien60/curriculum
        org.opencontainers.image.revision: ${GIT_SHA:-unknown}
