name: curriculum-dev

services:
  cv:
    build:
      context : ../app
      dockerfile: ../docker-app/Dockerfile
      target: ${ENV:-prod}
      labels:
        ## sur GitHub Packages, ghcr.io, rattache l'image au repo :
        org.opencontainers.image.source: https://github.com/Vivien60/curriculum
    volumes:
      - ../app:/var/www/html

