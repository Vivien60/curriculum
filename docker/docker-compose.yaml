name: curriculum

services:
  appcv:
    build:
      context : .
      target: apache-php
    networks:
      - proxy
    volumes:
      - ../app:/var/www/html
      - /var/log/apache2:/var/log/apache2
      - type: bind
        source: ${CV_PDF_PATH}
        target: /var/www/html/cv.pdf
        read_only: true
    labels:
      traefik.http.routers.appcv.rule: Host(`cv.localhost`)

networks:
  proxy:
    name: proxy
    external: true
