name: curriculum

services:
  cv:
    build:
      context : ..
      dockerfile: docker/Dockerfile
      target: ${ENV:-prod}
    networks:
      - web
    volumes:
      - /var/log/apache2:/var/log/apache2
      - type: bind
        source: ${CV_PDF_PATH}
        target: /var/www/html/cv.pdf
        read_only: true
    labels:
      env: ${ENV:-prod}

networks:
  web:
    name: web
    external: true
