services:
  web:
    build:
      context : .
      additional_contexts:
        cvpdf: ${CV_PDF_DIR:?CV_PDF_DIR manquant}
      # Nom du fichier PDF dans ce dossier, transmis au Dockerfile
      args:
        CV_PDF_NAME: ${CV_PDF_NAME:?CV_PDF_NAME manquant}
    volumes:
      - .:/var/www/html
      - /var/log/apache2:/var/log/apache2
      - type: bind
        source: ${CV_PDF_DIR}/${CV_PDF_NAME}
        target: /var/www/html/cv.pdf
        read_only: true
    ports:
      - "127.0.0.1:80:80"
