name: curriculum

services:
  proxy:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  appcv:
    build:
      context : .
      target: apache-php
    volumes:
      - ../app:/var/www/html
      - /var/log/apache2:/var/log/apache2
      - type: bind
        source: ${CV_PDF_PATH}
        target: /var/www/html/cv.pdf
        read_only: true
    labels:
      traefik.http.routers.appcv.rule: Host(`cv.localhost`)
      traefik.http.services.appcv.loadbalancer.server.port: "80"
